<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #6e6e73;
      --border: #d1d1d6;
      --accent: #d93025;
      --accent-text: #ffffff;
      --ok: #1e8e3e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f2f2f7;
        --muted: #98989f;
        --border: #38383a;
        --accent: #ff6b5e;
        --accent-text: #000000;
        --ok: #5bd17a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--text);
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 28px; margin: 8px 0 2px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; word-break: break-all; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 24px 4px 8px; font-weight: 600; }
    .card { background: var(--card); border-radius: 14px; padding: 14px; }
    label { display: block; font-size: 14px; color: var(--muted); margin: 0 0 6px; }
    .field + .field { margin-top: 14px; }
    input, textarea, select {
      width: 100%;
      font: inherit;
      font-size: 16px; /* avoids iOS zoom on focus */
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      -webkit-appearance: none;
      appearance: none;
    }
    textarea { min-height: 120px; resize: vertical; }
    .seg { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
    .seg button {
      flex: 1; border: 0; background: transparent; color: var(--text);
      font: inherit; font-size: 15px; padding: 8px; border-radius: 8px;
    }
    .seg button[aria-pressed="true"] { background: var(--card); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .row { display: flex; gap: 10px; }
    .row .field { flex: 1; margin-top: 0 !important; }
    #laterFields { margin-top: 14px; }
    .primary {
      width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 12px;
      background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600;
    }
    .primary:disabled { opacity: .5; }
    #status { min-height: 20px; margin: 10px 4px 0; font-size: 14px; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--accent); }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
    li:first-child { border-top: 0; padding-top: 0; }
    li:last-child { padding-bottom: 0; }
    .info { flex: 1; min-width: 0; }
    .info strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .info span { color: var(--muted); font-size: 14px; }
    .cancel { border: 1px solid var(--border); background: transparent; color: var(--accent); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px; }
    .empty { color: var(--muted); font-size: 15px; margin: 0; }
    .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
    #perDayFields, #dateField { margin-top: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Email Myself</h1>
  <p class="sub" id="me">&nbsp;</p>

  <form class="card" id="form" autocomplete="off">
    <div class="field">
      <label for="subject">Subject</label>
      <input id="subject" maxlength="250" required placeholder="Reminder">
    </div>
    <div class="field">
      <label for="body">Message</label>
      <textarea id="body" maxlength="5000" placeholder="What do you want to tell future you?"></textarea>
    </div>
    <div class="field">
      <label>When</label>
      <div class="seg" role="group">
        <button type="button" data-when="now" aria-pressed="true">Now</button>
        <button type="button" data-when="later" aria-pressed="false">Later</button>
      </div>
    </div>
    <div id="laterFields" hidden>
      <div class="field">
        <label for="repeat">Repeat</label>
        <select id="repeat">
          <option value="perday">Several times a day (evenly spaced)</option>
          <option value="none">Never</option>
          <option value="daily">Every day</option>
          <option value="weekdays">Every weekday (Mon–Fri)</option>
          <option value="weekly">Every week</option>
          <option value="monthly">Every month</option>
        </select>
      </div>
      <div id="dateField" class="field" hidden>
        <label for="sendAt">Date &amp; time</label>
        <input id="sendAt" type="datetime-local">
      </div>
      <div id="perDayFields">
        <div class="field">
          <label for="timesPerDay">Emails per day</label>
          <input id="timesPerDay" type="number" inputmode="numeric" min="1" max="100" value="4">
        </div>
        <div class="field row">
          <div class="field">
            <label for="fromTime">From</label>
            <input id="fromTime" type="time" value="00:00">
          </div>
          <div class="field">
            <label for="toTime">To</label>
            <input id="toTime" type="time" value="00:00">
          </div>
        </div>
        <p class="hint">Same From and To time = the whole day. Repeats every day until you cancel it.</p>
        <p class="hint" id="preview"></p>
      </div>
    </div>
    <button class="primary" id="submit" type="submit">Send now</button>
    <div id="status" role="status"></div>
  </form>

  <h2>Scheduled</h2>
  <div class="card">
    <ul id="list"></ul>
    <p class="empty" id="empty">Loading…</p>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const REPEAT_LABELS = {
    none: 'Once', daily: 'Every day', weekdays: 'Weekdays',
    weekly: 'Every week', monthly: 'Every month',
  };
  const repeatLabel = (item) =>
    item.repeat === 'perday' ? item.timesPerDay + '× a day' : REPEAT_LABELS[item.repeat];

  const toMinutes = (hhmm) => {
    const [h, m] = (hhmm || '00:00').split(':').map(Number);
    return h * 60 + m;
  };

  // Mirrors nextSlot_ in Code.gs: evenly spaced slots across the window.
  function slotTimes() {
    const n = Math.floor(Number($('timesPerDay').value));
    const from = toMinutes($('fromTime').value);
    const to = toMinutes($('toTime').value);
    const windowLen = (to - from + 1440) % 1440 || 1440;
    if (!(n >= 1 && n <= 100)) return { error: 'Choose between 1 and 100 emails per day.' };
    const gap = windowLen / n;
    if (gap < 5) return { error: 'Too many for that window — keep them at least 5 minutes apart.' };
    const times = [];
    for (let i = 0; i < n; i++) {
      const d = new Date(2000, 0, 1, 0, Math.round(from + i * gap));
      times.push(d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }));
    }
    return { times, gap, from, to };
  }

  function updatePreview() {
    const r = slotTimes();
    if (r.error) { $('preview').textContent = r.error; return; }
    const every = r.gap >= 60
      ? (Math.round(r.gap / 6) / 10) + ' hours'
      : Math.round(r.gap) + ' minutes';
    const shown = r.times.length > 12 ? r.times.slice(0, 12).join(', ') + ', …' : r.times.join(', ');
    $('preview').textContent = 'Every ' + every + ': ' + shown;
  }

  function updateRepeatFields() {
    const perDay = $('repeat').value === 'perday';
    $('perDayFields').hidden = !perDay;
    $('dateField').hidden = perDay;
    if (!perDay && !$('sendAt').value) $('sendAt').value = defaultTime();
    updatePreview();
  }
  ['timesPerDay', 'fromTime', 'toTime'].forEach((id) => $(id).addEventListener('input', updatePreview));
  $('repeat').addEventListener('change', updateRepeatFields);
  let when = 'now';

  // Promise wrapper around google.script.run
  function call(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }

  function setStatus(text, kind) {
    $('status').textContent = text;
    $('status').className = kind || '';
  }

  // datetime-local wants "YYYY-MM-DDTHH:MM" in local time
  function toLocalInput(date) {
    const pad = (n) => String(n).padStart(2, '0');
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) +
      'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
  }

  function defaultTime() {
    const d = new Date(Date.now() + 60 * 60 * 1000);
    d.setMinutes(0, 0, 0);
    return toLocalInput(d);
  }

  function formatTime(ms) {
    return new Date(ms).toLocaleString(undefined, {
      weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
    });
  }

  document.querySelectorAll('.seg button').forEach((btn) => {
    btn.addEventListener('click', () => {
      when = btn.dataset.when;
      document.querySelectorAll('.seg button').forEach((b) =>
        b.setAttribute('aria-pressed', String(b === btn)));
      $('laterFields').hidden = when !== 'later';
      $('submit').textContent = when === 'now' ? 'Send now' : 'Schedule';
      if (when === 'later') updateRepeatFields();
      setStatus('');
    });
  });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const subject = $('subject').value.trim();
    const body = $('body').value;
    $('submit').disabled = true;
    setStatus(when === 'now' ? 'Sending…' : 'Scheduling…');
    try {
      if (when === 'now') {
        await call('sendNow', subject, body);
        setStatus('Sent! Check your inbox.', 'ok');
      } else {
        const repeat = $('repeat').value;
        let saved;
        if (repeat === 'perday') {
          const r = slotTimes();
          if (r.error) throw new Error(r.error);
          saved = await call('scheduleEmail', {
            subject, body, repeat,
            timesPerDay: Number($('timesPerDay').value), fromMinute: r.from, toMinute: r.to,
          });
        } else {
          if (!$('sendAt').value) throw new Error('Pick a date and time.');
          const sendAt = new Date($('sendAt').value).getTime();
          saved = await call('scheduleEmail', { subject, body, sendAt, repeat });
        }
        setStatus('Scheduled — first one ' + formatTime(saved.sendAt) + '.', 'ok');
        loadList();
      }
      $('subject').value = '';
      $('body').value = '';
    } catch (err) {
      setStatus(err.message || String(err), 'err');
    } finally {
      $('submit').disabled = false;
    }
  });

  async function loadList() {
    try {
      const items = await call('listScheduled');
      const list = $('list');
      list.replaceChildren();
      items.forEach((item) => {
        const li = document.createElement('li');
        const info = document.createElement('div');
        info.className = 'info';
        const title = document.createElement('strong');
        title.textContent = item.subject;
        const meta = document.createElement('span');
        meta.textContent = repeatLabel(item) + ' · next ' + formatTime(item.sendAt);
        info.append(title, meta);

        const cancel = document.createElement('button');
        cancel.className = 'cancel';
        cancel.type = 'button';
        cancel.textContent = 'Cancel';
        cancel.addEventListener('click', async () => {
          if (!confirm('Cancel "' + item.subject + '"?')) return;
          cancel.disabled = true;
          try {
            await call('cancelScheduled', item.id);
            loadList();
          } catch (err) {
            cancel.disabled = false;
            setStatus(err.message || String(err), 'err');
          }
        });

        li.append(info, cancel);
        list.append(li);
      });
      $('empty').hidden = items.length > 0;
      $('empty').textContent = 'Nothing scheduled.';
    } catch (err) {
      $('empty').hidden = false;
      $('empty').textContent = 'Couldn’t load: ' + (err.message || err);
    }
  }

  call('getMyAddress').then((email) => { $('me').textContent = 'Sends to ' + email; });
  loadList();
</script>
</body>
</html>
